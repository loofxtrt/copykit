[paths]
git_repo = "/mnt/seagate/recursos/copyfax"
pack_local = "/mnt/seagate/symlinks/kde-user-icons/copyfax"
pack_stable = "/mnt/seagate/recursos/copyfax/copyfax"

# isso provavelmente quebra o pack_stable
# mas funciona quando ele vira pack_local
# depende do copycat original já estar instalado
# e também estar no mesmo diretório pai que o copycat (ex: /usr/share/icons/) 
substitutes = "../copycat"

[environment]
env_root = "/mnt/seagate/workspace/coding/projetos/scripts/copykit/environments/copyfax"
mappings = "{ENVIRONMENT}/mappings"
readme_template = "{ENVIRONMENT}/README.md"